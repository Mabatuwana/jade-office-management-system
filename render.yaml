services:
  - type: web
    name: jade-office-management-system
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        value: file:./dev.db
      - key: GOOGLE_DRIVE_TARGET_EMAIL
        value: umeshmabatuwana@gmail.com
